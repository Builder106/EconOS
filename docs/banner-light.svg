<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="EconOS — Economic Operating System">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#f7f3e9"/>
      <stop offset="100%" stop-color="#ece6d6"/>
    </linearGradient>
    <radialGradient id="cyanHaze" cx="22%" cy="50%" r="55%">
      <stop offset="0%"  stop-color="#006B7A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#006B7A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Paper background + subtle teal haze near the wordmark -->
  <rect width="1280" height="320" fill="url(#bgGrad)"/>
  <rect width="1280" height="320" fill="url(#cyanHaze)"/>

  <!-- Faint horizontal grid for "data" feel — dark-on-cream this time -->
  <g stroke="rgba(20,24,32,0.07)" stroke-width="1">
    <line x1="0" y1="80"  x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
  </g>

  <!-- EconOS wordmark — darker teal for paper contrast -->
  <text x="70" y="160" font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', sans-serif"
        font-size="108" font-weight="800" fill="#006B7A" letter-spacing="-3">EconOS</text>

  <!-- Subtitle, monospace, tracked-out -->
  <text x="74" y="196" font-family="ui-monospace, Menlo, Monaco, 'JetBrains Mono', monospace"
        font-size="14" fill="rgba(20,24,32,0.62)" letter-spacing="5">ECONOMIC OPERATING SYSTEM</text>

  <!-- Tagline -->
  <text x="70" y="244" font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', sans-serif"
        font-size="20" font-weight="500" fill="rgba(20,24,32,0.85)">A live multi-agent RL economy running as a shared mainframe.</text>

  <!-- Stack line -->
  <text x="70" y="276" font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', sans-serif"
        font-size="13" fill="rgba(20,24,32,0.55)">12 agents | PettingZoo + PPO | FastAPI | WebSocket fan-out</text>

  <!-- Macro Monitor mock panel (right) — light-theme chart colors -->
  <g transform="translate(810, 50)">
    <rect x="0" y="0" width="400" height="220" rx="5"
          fill="rgba(0,107,122,0.04)" stroke="rgba(0,107,122,0.28)" stroke-width="1"/>

    <text x="14" y="22" font-family="ui-monospace, Menlo, Monaco, 'JetBrains Mono', monospace"
          font-size="10" fill="rgba(20,24,32,0.5)" letter-spacing="2.5">MARKET | WAGE / PRICE</text>

    <g stroke="rgba(20,24,32,0.08)" stroke-width="1">
      <line x1="20" y1="70"  x2="380" y2="70"/>
      <line x1="20" y1="120" x2="380" y2="120"/>
      <line x1="20" y1="170" x2="380" y2="170"/>
    </g>

    <!-- Wage line (gold, darker for paper) -->
    <polyline fill="none" stroke="#8A5D00" stroke-width="2.2" stroke-linejoin="round"
              points="20,160 50,148 80,152 110,128 140,108 170,98 200,110 230,90 260,78 290,68 320,72 350,58 380,52"/>
    <!-- Price line (dark teal) -->
    <polyline fill="none" stroke="#006B7A" stroke-width="2.2" stroke-linejoin="round"
              points="20,190 50,178 80,162 110,154 140,138 170,148 200,132 230,120 260,130 290,108 320,98 350,108 380,90"/>

    <g transform="translate(18, 200)" font-family="ui-monospace, Menlo, monospace" font-size="10">
      <rect x="0" y="-9" width="13" height="3" fill="#8A5D00"/>
      <text x="19" y="-1" fill="#8A5D00">WAGE</text>
      <rect x="76" y="-9" width="13" height="3" fill="#006B7A"/>
      <text x="95" y="-1" fill="#006B7A">PRICE</text>
    </g>
  </g>
</svg>
