name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel stale runs on the same branch to save CI minutes — useful when you
# push -f or land several commits in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: ""

  commitlint:
    name: Commit message lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  pytest:
    name: pytest (env + commands) & build / license checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --frozen --group dev

      - name: Python dependency audit
        run: uv run --with pip-audit pip-audit

      - name: License compliance check
        run: uv run --with pip-licenses pip-licenses --fail-on="AGPL;GPL"

      - name: Package build check
        run: uv build --no-sources || uv build

      - name: Lint with Ruff
        run: uv run --frozen ruff check server simulation

      - name: Run pytest
        env:
          PYTHONWARNINGS: "error"
        run: uv run --frozen pytest -W error
        run: uv run --frozen pytest

  playwright:
    name: playwright (e2e dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Playwright config's webServer spawns uvicorn, so the e2e job
      # needs the Python deps too — not just Node + Chromium.
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --frozen --group dev

      - name: Set up Node 26
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Node dependency audit
        run: npm audit --audit-level=high

      # Cache Playwright's downloaded Chromium binary across runs (~250 MB).
      # Key on package-lock so an upgrade busts the cache automatically.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium + system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Generate Gherkin specs
        run: npx bddgen

      - name: Run Playwright
        run: npx playwright test

      # On failure, upload the report + raw test-results so you can download
      # and replay traces / videos locally to debug.
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
